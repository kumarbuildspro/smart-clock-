<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="clock-container">
            <div class="clock">
                <div class="time-display" id="timeDisplay">00:00:00</div>
                <div class="date-display" id="dateDisplay">Monday, January 1, 2024</div>
            </div>
            
            <div class="controls">
                <button id="toggleFormat" class="btn">Toggle 24/12 Hour</button>
                <button id="toggleTheme" class="btn">Toggle Theme</button>
                <button id="startStop" class="btn">Start/Stop</button>
                <button id="reset" class="btn">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
